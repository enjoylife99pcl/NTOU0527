<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 隨堂小測驗</title>
    <style>
        /* 基礎版面設定：乾淨、明亮 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff; /* 溫和的淡藍色背景 */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 測驗主容器卡片 */
        .container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #4a90e2; /* 活潑的藍色 */
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* 表單區塊設計 */
        .form-group {
            margin-bottom: 20px;
        }

        label.section-title {
            display: block;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #b0c4de;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
        }

        /* 題目卡片設計 */
        .question-card {
            background-color: #fff9e6; /* 柔和的淡黃色 */
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 6px solid #ffd700;
        }

        .option {
            display: block;
            margin: 12px 0;
            cursor: pointer;
            font-size: 1.05em;
        }

        input[type="radio"] {
            transform: scale(1.2);
            margin-right: 10px;
            cursor: pointer;
        }

        /* 按鈕設計 */
        button {
            width: 100%;
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #357abd;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #a0c4e8;
            cursor: not-allowed;
        }

        /* 訊息提示區塊 */
        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            min-height: 24px;
        }
        
        .success { color: #28a745; } /* 成功綠 */
        .error { color: #dc3545; }   /* 錯誤紅 */
        .loading { color: #6c757d; } /* 處理中灰 */
    </style>
</head>
<body>

    <div class="container">
        <h1>📝 隨堂小測驗</h1>
        
        <div class="form-group">
            <label class="section-title" for="studentName">學生姓名：</label>
            <input type="text" id="studentName" placeholder="請輸入你的名字（必填）" required>
        </div>

        <div class="question-card">
            <label class="section-title">1. 台灣最高的山是哪一座？</label>
            <label class="option"><input type="radio" name="q1" value="阿里山"> 阿里山</label>
            <label class="option"><input type="radio" name="q1" value="玉山"> 玉山</label>
            <label class="option"><input type="radio" name="q1" value="陽明山"> 陽明山</label>
        </div>

        <div class="question-card">
            <label class="section-title">2. 水的三態中，固態稱為什麼？</label>
            <label class="option"><input type="radio" name="q2" value="冰"> 冰</label>
            <label class="option"><input type="radio" name="q2" value="水蒸氣"> 水蒸氣</label>
            <label class="option"><input type="radio" name="q2" value="雲"> 雲</label>
        </div>

        <button id="submitBtn" onclick="submitQuiz()">送出並看成績 🚀</button>

        <div id="message"></div>
    </div>

    <script>
        // 填入您提供的 GAS Web App 網址
        const scriptURL = "https://script.google.com/macros/s/AKfycby_r_4LDG3AwMXMkMlizlVSwXFT66Yw_C2f2ZQF3FgcVgc4x3M0dlyBvepO2wXRPykrZQ/exec";

        function submitQuiz() {
            // 取得使用者輸入的資料
            const name = document.getElementById("studentName").value.trim();
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
            
            const messageEl = document.getElementById("message");
            const submitBtn = document.getElementById("submitBtn");

            // 1. 基礎防呆：確認姓名是否填寫、題目是否作答
            if (!name) {
                showMessage("請輸入學生姓名喔！", "error");
                return;
            }
            if (!q1 || !q2) {
                showMessage("請確認兩題都已經作答完畢！", "error");
                return;
            }

            // 2. 批改邏輯 (每題 50 分，滿分 100 分)
            let score = 0;
            if (q1.value === "玉山") score += 50;
            if (q2.value === "冰") score += 50;

            // 3. 準備送出狀態 (鎖定按鈕避免學生重複點擊)
            showMessage("試卷批改並傳送中，請稍候...", "loading");
            submitBtn.disabled = true;

            // 組合要傳送給 Google Sheets 的 JSON 資料
            const payload = {
                name: name,
                score: score
            };

            // 4. 發送 POST 請求至 GAS
            fetch(scriptURL, {
                method: "POST",
                // 關鍵：使用 text/plain 以避開瀏覽器 CORS 的 OPTIONS 預檢攔截
                headers: {
                    "Content-Type": "text/plain"
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json()) // GAS 端我們設定了 JSON 格式回傳
            .then(data => {
                if (data.status === "success") {
                    // 成功寫入試算表
                    showMessage(`🎉 批改完成！${name} 的成績是 ${score} 分！`, "success");
                } else {
                    // GAS 拋出錯誤
                    showMessage("寫入失敗：" + data.message, "error");
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                // 網路連線錯誤處理
                console.error("Fetch 錯誤:", error);
                showMessage("網路連線發生問題，請稍後再試！", "error");
                submitBtn.disabled = false;
            });
        }

        // 輔助函式：用來切換畫面上的提示文字與顏色
        function showMessage(text, type) {
            const messageEl = document.getElementById("message");
            messageEl.textContent = text;
            messageEl.className = type;
        }
    </script>
</body>
</html>
